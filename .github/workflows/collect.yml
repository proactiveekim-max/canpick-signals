name: CANPICK 키워드 수집

on:
  schedule:
    - cron: "0 2 * * *"   # 매일 오전 11시 (KST = UTC+9, 02:00 UTC)
  workflow_dispatch:        # 수동 실행도 가능

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 수집 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python collect.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "canpick-bot"
          git config user.email "bot@canpick.kr"
          git add data/keywords.json
          git diff --staged --quiet || git commit -m "data: $(date '+%Y-%m-%d') 키워드 업데이트"
          git push
